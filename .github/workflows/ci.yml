name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  change-scope:
    name: Change scope
    uses: ./.github/workflows/change-scope.yml
    with:
      previous_workflow: ci.yml
    permissions:
      actions: read
      contents: read

  ghalint:
    name: ghalint
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ghalint
        run: |
          $goModPath = 'tools/ghalint/go.mod'
          $versionLine = Get-Content $goModPath | Where-Object { $_ -match 'github\.com/suzuki-shunsuke/ghalint\s+v\d+\.\d+\.\d+' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($versionLine)) {
            throw "Unable to resolve ghalint version from $goModPath."
          }

          $version = [regex]::Match($versionLine, 'github\.com/suzuki-shunsuke/ghalint\s+(v\d+\.\d+\.\d+(?:[-+][^\s]+)?)').Groups[1].Value
          go install "github.com/suzuki-shunsuke/ghalint/cmd/ghalint@$version"
          Join-Path (go env GOPATH) 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run ghalint
        run: ./scripts/Invoke-WorkflowLint.ps1

  preview-compatibility:
    name: Preview compatibility tooling (${{ matrix.os }})
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run_ci == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test candidate selection, state, and publication validation
        run: ./scripts/tests/Test-PreviewCompatibility.ps1

      - name: Test CI change scope with Git fixtures
        run: ./scripts/tests/Test-CiChangeScope.ps1

      - name: Install pinned agentic workflow compiler
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pin = [regex]::Match((Get-Content tools/gh-aw/go.mod -Raw), '(?m)^require github\.com/github/gh-aw (v\d+\.\d+\.\d+)\s*$')
          if (-not $pin.Success) {
            throw 'Invalid gh-aw compiler version.'
          }
          gh extension install github/gh-aw --pin $pin.Groups[1].Value
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed.' }

      - name: Check agentic workflow compilation and policy
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile docs-preview-compatibility --no-check-update
          if ($LASTEXITCODE -ne 0) { throw 'Agentic workflow compilation failed.' }
          $changed = git status --porcelain -- .github/workflows .github/aw .gitattributes
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect compiler outputs.' }
          if ($changed) { throw "Recompile and commit the agentic workflow outputs: $changed" }
          ./scripts/tests/Test-PreviewCompatibilityWorkflow.ps1

  build-test:
    name: Build and test
    needs: change-scope
    if: ${{ needs.change-scope.outputs.run_ci == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RepoSyncRadar.sln

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build RepoSyncRadar.sln --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test RepoSyncRadar.sln --no-build --timeout 10m --
          --filter-not-trait Category=Manual
          --output detailed
          --coverage
          --coverage-output artifacts/coverage/reposyncradar.cobertura.xml
          --coverage-output-format cobertura

      - name: Merge coverage reports
        run: >
          dotnet reportgenerator
          "-reports:tests/**/TestResults/artifacts/coverage/reposyncradar.cobertura.xml"
          "-targetdir:artifacts/coverage/merged"
          "-reporttypes:Cobertura;MarkdownSummaryGithub"
          "-verbosity:Warning"

      - name: Add coverage summary
        run: Get-Content artifacts/coverage/merged/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload code coverage
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-code-coverage@v1.4.4
        with:
          file: artifacts/coverage/merged/Cobertura.xml
          language: "C#"
          label: code-coverage/dotnet
          # GitHub Code Quality is in public preview and may be unavailable for
          # private repositories outside eligible plans; keep CI green while
          # still surfacing upload errors in the workflow log.
          fail-on-error: false

      - name: Upload test result logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7


  installed-package-e2e:
    name: Installed package E2E
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build win-x64 Velopack package
        run: |
          ./scripts/Build-VelopackRelease.ps1 `
            -Runtime win-x64 `
            -Channel win-x64-ci `
            -OutputRoot artifacts/ci-release `
            -Force `
            -NoPortable `
            -NoLegacyManifest

      - name: Smoke test installed package
        run: ./scripts/Test-VelopackInstalledE2E.ps1 -Runtime win-x64 -ReleaseDir artifacts/ci-release/velopack/win-x64 -CleanInstallRoot

      - name: Upload installed-package test result logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-package-test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7